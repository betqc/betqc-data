# Robot BetQC : balayage des cotes aux 10 minutes, registre de paris fictifs, données publiées ici.
# Le moteur vit dans le dépôt privé betqc/betqc (lu avec le secret CODE_TOKEN, en lecture seule).
# Le site betqc.netlify.app lit public/*.json directement : aucun redéploiement Netlify.
# GitHub retarde souvent les déclencheurs planifiés (40 à 60 minutes entre deux passages observés).
# Chaque exécution boucle donc elle-même aux 10 minutes pendant environ 50 minutes, et les
# déclencheurs suivants attendent leur tour : la couverture reste continue malgré les retards.
# GitHub a aussi cessé de déclencher le cron pendant 8 à 9 heures (nov. 2026) : à la fin de chaque
# exécution, le robot relance donc lui-même le passage suivant s'il n'y en a aucun en file.
# Pour l'arrêter : onglet Actions de ce dépôt, BetQC robot, « Disable workflow ».
name: BetQC robot

on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: betqc-robot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - name: Données
        uses: actions/checkout@v4
        with:
          path: data
      - name: Moteur (dépôt privé)
        uses: actions/checkout@v4
        with:
          repository: betqc/betqc
          token: ${{ secrets.CODE_TOKEN }}
          path: code
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements.txt
      - run: pip install -r code/requirements.txt
      - name: Boucle de balayages (environ 50 minutes)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BETQC_LIVE_DIR: ${{ github.workspace }}/data/live
          BETQC_PUBLIC_DIR: ${{ github.workspace }}/data/public
          BETQC_REGIONS: ${{ vars.BETQC_REGIONS }}
          BETQC_REAL_BANKROLL: ${{ vars.BETQC_REAL_BANKROLL }}
        run: |
          cd data
          git config user.name "betqc-robot"
          git config user.email "betqc-robot@users.noreply.github.com"
          end=$(( $(date +%s) + 50*60 ))
          while :; do
            python ../code/pipeline/scheduler.py --once || true
            git add -A live public
            if ! git diff --cached --quiet; then
              git commit -q -m "Cotes $(date -u +%Y-%m-%dT%H:%MZ)"
              for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
            fi
            [ $(( $(date +%s) + 600 )) -lt $end ] || break
            sleep 600
          done
      - name: Relance du passage suivant
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          waiting=$(gh api "repos/${{ github.repository }}/actions/workflows/robot.yml/runs?status=queued" -q '.total_count' || echo 0)
          if [ "$waiting" = "0" ]; then
            gh api -X POST "repos/${{ github.repository }}/actions/workflows/robot.yml/dispatches" -f ref=main && echo "Passage suivant lancé"
          else
            echo "Un passage attend déjà son tour"
          fi
