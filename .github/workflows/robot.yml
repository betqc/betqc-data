# Robot BetQC : balayage des cotes aux 10 minutes, registre de paris fictifs, données publiées ici.
# Le moteur vit dans le dépôt privé betqc/betqc (lu avec le secret CODE_TOKEN, en lecture seule).
# Le site betqc.netlify.app lit public/*.json directement : aucun redéploiement Netlify.
name: BetQC robot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: betqc-robot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Données
        uses: actions/checkout@v4
        with:
          path: data
      - name: Moteur (dépôt privé)
        uses: actions/checkout@v4
        with:
          repository: betqc/betqc
          token: ${{ secrets.CODE_TOKEN }}
          path: code
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements.txt
      - run: pip install -r code/requirements.txt
      - name: Passage du planificateur
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BETQC_LIVE_DIR: ${{ github.workspace }}/data/live
          BETQC_PUBLIC_DIR: ${{ github.workspace }}/data/public
        run: python code/pipeline/scheduler.py --once
      - name: Publier si les données ont changé
        working-directory: data
        run: |
          git config user.name "betqc-robot"
          git config user.email "betqc-robot@users.noreply.github.com"
          git add -A live public
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -q -m "Cotes $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull -q --rebase
            git push -q
          fi
