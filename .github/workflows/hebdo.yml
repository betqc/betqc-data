# Chaque lundi : historique football-data et xG Understat à jour, efficacité, backtest et modèle recalculés.
# Les JSON vont dans public/hist/ ; le site les lit directement, sans redéploiement.
name: BetQC hebdo

on:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: betqc-hebdo
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Données
        uses: actions/checkout@v4
        with:
          path: data
      - name: Moteur (dépôt privé)
        uses: actions/checkout@v4
        with:
          repository: betqc/betqc
          token: ${{ secrets.CODE_TOKEN }}
          path: code
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements.txt
      - run: pip install -r code/requirements.txt
      - name: Reconstruction
        env:
          BETQC_SITE_DATA: ${{ github.workspace }}/data/public/hist
        run: |
          python code/pipeline/build.py
          python code/pipeline/understat.py
          python code/pipeline/model_export.py --refit
      - name: Publier
        working-directory: data
        run: |
          git config user.name "betqc-robot"
          git config user.email "betqc-robot@users.noreply.github.com"
          git add public/hist
          if ! git diff --cached --quiet; then
            git commit -q -m "Historique $(date -u +%F)"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          fi
